[project]
name = "subtle"
version = "0.1.0"
description = "Turn any audio/video into YouTube-ready subtitle files (SRT, VTT, TXT, JSON, ASS) with local Whisper."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "av<19",  # PyAV 19 removed an argument faster-whisper's fallback decoder uses
    "typer>=0.12",
    "rich>=13",
    "questionary>=2.0",
]

[project.scripts]
subtle = "subtle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
